<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./Ex_2(css).css" rel="stylesheet" type="text/css" >
    <title>Регистрация</title>
</head>
<body>
    <div class="navigation">
        <h1>Магазин техники</h1>
        <button class="button"><a href="Ex_2.html">На главную</a></button>
    </div>
    <form>
        <label for="username">Имя пользователя:</label>
        <input type="text" id="username" name="username"><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br>
        <label for="pwd">Пароль:</label>
        <input type="password" id="pwd" name="pwd"><br>
        <label for="gender">Пол:</label><br>
        <input type="radio" id="man" value="man" name="gender">
        <label for="man">Мужской</label><br>
        <input type="radio" id="woman" value="woman" name="gender">
        <label for="woman">Женский</label><br>
        <input type="checkbox" id="pers_date" name="pers_date" value="Pers_date">
        <label for="pers_date">Согласие на обработку персональных данных</label><br>
        <input type="checkbox" id="mailing" name="mailing" value="Mailing">
        <label for="mailing">Согласие на получение рассылки</label><br>
        <input type="submit" value="Зарегистрироваться">
    </form>
</body>
</html>
